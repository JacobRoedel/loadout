name: 'Loadout check'
description: 'Check a repository local development-environment readiness with Loadout and annotate PRs with any missing requirement.'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  path:
    description: 'Repository directory to check'
    required: false
    default: '.'
  profile:
    description: 'Comma-separated built-in requirement profiles to include (web, rust, python, containers, infra, data)'
    required: false
    default: ''
  strict:
    description: 'Treat warnings as failures'
    required: false
    default: 'false'
  services:
    description: 'Also verify configured services are reachable (database/cache URLs, Docker daemon, AWS identity)'
    required: false
    default: 'false'
  changed:
    description: 'Only check requirements whose source file changed relative to this git ref, e.g. origin/main. Requires the checkout step to fetch enough history to diff against it.'
    required: false
    default: ''
  version:
    description: 'Git ref of JacobRoedel/loadout to build and run'
    required: false
    default: 'main'
runs:
  using: 'composite'
  steps:
    # Tagged releases (version: v1.2.3) ship prebuilt binaries on Linux and
    # macOS runners, which is much faster than building from source. Windows
    # runners, and any non-release ref (branches, commits, "main"), always
    # fall back to building from source below.
    - name: Try downloading a prebuilt Loadout binary
      id: prebuilt
      shell: bash
      env:
        LOADOUT_VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        found="false"
        if [ "$RUNNER_OS" != "Windows" ]; then
          case "$LOADOUT_VERSION" in
            v[0-9]*)
              case "$(uname -s)-$(uname -m)" in
                Linux-x86_64) target="x86_64-unknown-linux-gnu" ;;
                Linux-aarch64) target="aarch64-unknown-linux-gnu" ;;
                Darwin-x86_64) target="x86_64-apple-darwin" ;;
                Darwin-arm64) target="aarch64-apple-darwin" ;;
                *) target="" ;;
              esac
              if [ -n "$target" ]; then
                url="https://github.com/JacobRoedel/loadout/releases/download/${LOADOUT_VERSION}/loadout-${target}.tar.gz"
                checksums_url="https://github.com/JacobRoedel/loadout/releases/download/${LOADOUT_VERSION}/checksums.txt"
                mkdir -p .loadout-bin
                asset="loadout-${target}.tar.gz"
                if curl -fsSL "$url" -o .loadout-bin/loadout.tar.gz && curl -fsSL "$checksums_url" -o .loadout-bin/checksums.txt; then
                  expected="$(awk -v asset="$asset" '$2 == "./" asset || $2 == asset { print $1; exit }' .loadout-bin/checksums.txt)"
                  actual="$(sha256sum .loadout-bin/loadout.tar.gz | awk '{print $1}')"
                  if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
                    echo "loadout: downloaded release checksum did not match" >&2
                    exit 1
                  fi
                  tar xzf .loadout-bin/loadout.tar.gz -C .loadout-bin
                  bin_path="$(find .loadout-bin -type f -name loadout | head -n 1)"
                  if [ -n "$bin_path" ]; then
                    chmod +x "$bin_path"
                    echo "bin=$bin_path" >> "$GITHUB_OUTPUT"
                    found="true"
                  fi
                fi
              fi
              ;;
          esac
        fi
        echo "found=$found" >> "$GITHUB_OUTPUT"
    - name: Checkout Loadout source
      if: steps.prebuilt.outputs.found != 'true'
      uses: actions/checkout@v4
      with:
        repository: JacobRoedel/loadout
        ref: ${{ inputs.version }}
        path: .loadout-action-src
    - name: Install Rust toolchain
      if: steps.prebuilt.outputs.found != 'true'
      uses: dtolnay/rust-toolchain@stable
    - name: Build Loadout from source
      if: steps.prebuilt.outputs.found != 'true'
      shell: bash
      run: cargo build --release --locked --manifest-path .loadout-action-src/Cargo.toml
    - name: Run loadout check
      shell: bash
      env:
        LOADOUT_PATH: ${{ inputs.path }}
        LOADOUT_PROFILE_INPUT: ${{ inputs.profile }}
        LOADOUT_STRICT: ${{ inputs.strict }}
        LOADOUT_SERVICES: ${{ inputs.services }}
        LOADOUT_CHANGED: ${{ inputs.changed }}
        LOADOUT_BIN: ${{ steps.prebuilt.outputs.found == 'true' && steps.prebuilt.outputs.bin || '.loadout-action-src/target/release/loadout' }}
      run: |
        set -euo pipefail
        args=(check "$LOADOUT_PATH" --annotate)
        if [ -n "$LOADOUT_PROFILE_INPUT" ]; then
          args+=(--profile "$LOADOUT_PROFILE_INPUT")
        fi
        if [ "$LOADOUT_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ "$LOADOUT_SERVICES" = "true" ]; then
          args+=(--services)
        fi
        if [ -n "$LOADOUT_CHANGED" ]; then
          args+=(--changed "$LOADOUT_CHANGED")
        fi
        "$LOADOUT_BIN" "${args[@]}"
