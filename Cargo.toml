[package]
name = "loadout"
version = "0.1.0"
edition = "2024"
description = "Check whether a repository's local development environment is ready"
license = "MIT"
repository = "https://github.com/jacobroedel/loadout"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"
